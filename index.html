<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHARA NOTE</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 14px;
  background: #fff5f8;
  color: #765765;
  font-family: sans-serif;
}
main {
  max-width: 620px;
  margin: auto;
  padding: 25px 20px;
  background: #fff;
  border: 2px solid #f4cbd9;
  border-radius: 22px;
  box-shadow: 0 4px 18px #e8bdcc55;
}
h1 {
  margin: 0;
  text-align: center;
  color: #d887a6;
  letter-spacing: 3px;
}
.subtitle {
  text-align: center;
  color: #bd91a4;
  font-size: 12px;
  margin: 8px 0 24px;
}
label {
  display: block;
  margin: 17px 0 7px;
  font-size: 14px;
  font-weight: bold;
}
input, textarea, select {
  width: 100%;
  padding: 11px;
  border: 1px solid #edcbd8;
  border-radius: 10px;
  background: #fffafd;
  color: #765765;
  font: inherit;
}
textarea {
  min-height: 76px;
  resize: vertical;
}
button {
  display: block;
  width: 100%;
  margin-top: 20px;
  padding: 13px;
  border: 0;
  border-radius: 24px;
  background: #e7a8bf;
  color: white;
  font-size: 15px;
  font-weight: bold;
}
button:active { opacity: .8; }
.note {
  text-align: center;
  font-size: 11px;
  color: #b18d9d;
  margin-top: 18px;
}
</style>
</head>
<body>
<main>
  <h1>CHARA NOTE</h1>
  <p class="subtitle">♡ character profile book ♡</p>

  <label for="charName">キャラクターの名前</label>
  <input id="charName" placeholder="名前を入力してね">

  <label for="catch">キャッチコピー</label>
  <input id="catch" placeholder="この子を一言で表すなら？">

  <label for="background">プロフィールの背景</label>
  <select id="background">
    <option value="pink">ふんわりピンク</option>
    <option value="white">シンプルホワイト</option>
    <option value="lavender">ラベンダー</option>
  </select>

  <section id="questions"></section>

  <button type="button" onclick="saveDraft()">回答を保存する</button>
  <button type="button" onclick="saveImage()">プロフィール画像を作る ♡</button>

  <p class="note">CHARA NOTE — made with love ♡</p>
</main>

<script>
// 管理者用：質問を増やすときは、この配列に質問文を追加してください。
// 例：["誕生日", "性格", "好きな食べ物"]
const QUESTION_LIST = [
  "誕生日",
  "性格"
];

const questionsArea = document.getElementById("questions");

QUESTION_LIST.forEach((question, index) => {
  const label = document.createElement("label");
  label.textContent = question;

  const textarea = document.createElement("textarea");
  textarea.id = "answer" + index;
  textarea.placeholder = "ここに回答を入力してね";

  questionsArea.appendChild(label);
  questionsArea.appendChild(textarea);
});

function getAnswers() {
  return QUESTION_LIST.map((question, index) => ({
    question,
    answer: document.getElementById("answer" + index).value
  }));
}

function saveDraft() {
  const data = {
    charName: document.getElementById("charName").value,
    catch: document.getElementById("catch").value,
    background: document.getElementById("background").value,
    answers: getAnswers()
  };

  localStorage.setItem("charaNoteDraft", JSON.stringify(data));
  alert("回答をこの端末に保存したよ！");
}

function loadDraft() {
  const saved = localStorage.getItem("charaNoteDraft");
  if (!saved) return;

  try {
    const data = JSON.parse(saved);
    document.getElementById("charName").value = data.charName || "";
    document.getElementById("catch").value = data.catch || "";
    document.getElementById("background").value = data.background || "pink";

    const answers = data.answers || [];
    QUESTION_LIST.forEach((question, index) => {
      const found = answers.find(item => item.question === question);
      if (found) {
        document.getElementById("answer" + index).value = found.answer || "";
      }
    });
  } catch (error) {
    console.log("保存データを読み込めませんでした");
  }
}

function saveImage() {
  const name = document.getElementById("charName").value || "キャラクター";
  const catchCopy = document.getElementById("catch").value;
  const answers = getAnswers();

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = 1000;
  canvas.height = Math.max(1200, 490 + answers.length * 190);

  const colors = {
    pink: ["#fff3f7", "#f3c6d7", "#d887a6"],
    white: ["#ffffff", "#f0dce5", "#bd91a4"],
    lavender: ["#f7f3ff", "#d9c9f0", "#9b83bd"]
  };
  const selected = colors[document.getElementById("background").value] || colors.pink;

  ctx.fillStyle = selected[0];
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = selected[1];
  ctx.lineWidth = 12;
  ctx.strokeRect(28, 28, canvas.width - 56, canvas.height - 56);

  ctx.textAlign = "center";
  ctx.fillStyle = selected[2];
  ctx.font = "bold 48px sans-serif";
  ctx.fillText("♡ CHARA NOTE ♡", 500, 115);

  ctx.fillStyle = "#765765";
  ctx.font = "bold 58px sans-serif";
  ctx.fillText(name, 500, 225, 850);

  ctx.font = "30px sans-serif";
  ctx.fillStyle = "#a17d8e";
  ctx.fillText(catchCopy, 500, 290, 850);

  let y = 390;
  ctx.textAlign = "left";

  answers.forEach(item => {
    ctx.fillStyle = selected[1];
    ctx.fillRect(75, y - 42, 850, 58);

    ctx.fillStyle = selected[2];
    ctx.font = "bold 30px sans-serif";
    ctx.fillText(item.question, 100, y);

    ctx.fillStyle = "#765765";
    ctx.font = "27px sans-serif";
    y += 65;

    const text = item.answer || "（未入力）";
    const lines = wrapText(ctx, text, 790);

    lines.forEach(line => {
      ctx.fillText(line, 105, y);
      y += 42;
    });

    y += 55;
  });

  const link = document.createElement("a");
  link.download = "chara-note.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}

function wrapText(ctx, text, maxWidth) {
  const lines = [];
  const paragraphs = text.split("\n");

  paragraphs.forEach(paragraph => {
    let line = "";
    for (const char of paragraph) {
      const testLine = line + char;
      if (ctx.measureText(testLine).width > maxWidth && line) {
        lines.push(line);
        line = char;
      } else {
        line = testLine;
      }
    }
    lines.push(line);
  });

  return lines;
}

loadDraft();
</script>
</body>
</html>
